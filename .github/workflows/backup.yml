name: Backup

# Free-tier Supabase (see supabase-keep-alive.yml) has no automatic backups
# at all -- Supabase's own daily-backup feature only starts at the Pro
# plan. Without this workflow, losing the Supabase project loses the
# database and every uploaded media file permanently. Runs both backup
# scripts on a daily schedule and uploads to Cloudflare R2 (kept off both
# Netlify and GitHub Actions' own short-lived artifact storage, which
# isn't meant for long-term retention).
#
# Required repo secrets beyond the ones already in use elsewhere
# (NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY):
#  - DATABASE_URL: Supabase Dashboard -> Project Settings -> Database ->
#    Connection string -> URI, "Session pooler" specifically -- NOT
#    "Direct connection" (resolves IPv6-only on newer Supabase projects,
#    and GitHub Actions runners have no IPv6 egress: confirmed directly,
#    first live run failed with "Network is unreachable") and NOT
#    "Transaction pooler" either (doesn't support the session-level
#    features pg_dump needs). Session pooler is the one that's both
#    IPv4-reachable from Actions and session-capable.
#  - R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME:
#    from a Cloudflare R2 bucket + API token. See README.md's Backups
#    section for the full walkthrough.
#
# workflow_dispatch lets this be triggered on demand to verify it actually
# works, without waiting for the schedule.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ubuntu 24.04's default apt repo only has postgresql-client 16, but
      # pg_dump refuses to run against a server newer than itself --
      # confirmed directly: Supabase runs Postgres 17.6, and a plain
      # `apt-get install postgresql-client` pulled 16.14, aborting every
      # run with "server version mismatch". The official PGDG apt repo
      # (added via postgresql-common's bundled script, the documented way
      # to do this non-interactively) carries versioned packages, so this
      # pins the client to 17 -- matching or ahead of the server, which is
      # what pg_dump actually requires.
      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Back up database
        run: npx tsx scripts/backup-database.ts

      - name: Back up media library
        run: npx tsx scripts/backup-media.ts

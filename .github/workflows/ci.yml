name: CI

# Runs on every push and PR against Dev2/main: typecheck and build, so a
# broken build/type state gets caught here instead of only being noticed
# after it's merged (or worse, deployed). Uses the same three Supabase
# secrets as rls-tests below, both so the build actually exercises real
# data (real static generation, not an empty-data fallback) and because
# lib/env.ts (added for env var validation) now treats them as required --
# without real values here, the build would fail at env validation before
# ever reaching the "gracefully degrade" fallbacks those lib/supabase/*
# functions still have for local dev. If a fork/CI run genuinely has no
# Supabase secrets available, set SKIP_ENV_VALIDATION=1 to opt out of that
# check (see lib/env.ts) -- everything still degrades gracefully at
# runtime either way, this only affects whether the build fails fast.
#
# `npm run lint` is deliberately not run here: it currently fails with 121
# pre-existing @typescript-eslint/no-explicit-any errors scattered across
# the codebase (none from recent work), so wiring it in now would make this
# workflow red from its first run. Add it back once that's cleaned up.

on:
  push:
    branches: [main, Dev2]
  pull_request:
    branches: [main, Dev2]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # RLS regression tests (tests/rls/*.test.ts) run against the real
  # Supabase project -- there's no separate test project for this app.
  # Every test creates its own throwaway rows and cleans them up; nothing
  # here reads or writes real content. Needs NEXT_PUBLIC_SUPABASE_URL,
  # NEXT_PUBLIC_SUPABASE_ANON_KEY, and SUPABASE_SERVICE_ROLE_KEY as repo
  # secrets -- until those are added this job fails fast with a clear
  # "X is not set" error from tests/rls/helpers.ts rather than skipping
  # silently.
  #
  # `npm test` also picks up tests/rate-limit.test.ts, which needs
  # UPSTASH_REDIS_REST_URL/UPSTASH_REDIS_REST_TOKEN the same way -- add
  # those two as repo secrets once Upstash is provisioned (see
  # lib/rate-limit.ts), same fail-fast-not-skip pattern.
  rls-tests:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: RLS + rate limit regression tests
        run: npm test

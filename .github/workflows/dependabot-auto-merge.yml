name: Dependabot auto-merge

# Enables auto-merge on a Dependabot PR for minor/patch npm bumps and every
# GitHub Actions bump (those are almost never breaking) -- it doesn't merge
# immediately; GitHub queues it and merges once every required status check
# on main (build, rls-tests -- see branch protection) actually passes.
# Major npm version bumps (e.g. a future Tailwind v4 or TypeScript 7
# attempt) are deliberately excluded -- those get a real look before
# merging, not just a green check.

on: pull_request

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for minor/patch and GitHub Actions updates
        if: |
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

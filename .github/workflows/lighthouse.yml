name: Lighthouse

# Performance/accessibility/SEO audits against a real deployment. Not run
# on every push in the sense of gating it -- Lighthouse audits are slow
# and this is meant to track trends and catch regressions after a deploy,
# not block a commit. Assertions in lighthouserc*.js are deliberately
# loose "warn" thresholds for now (no real baseline has been benchmarked
# yet); reports upload to temporary-public-storage and the shareable link
# is printed in the job log either way.
#
# Runs on push to both main and Dev2 -- Dev2 was deliberately left out
# before, so a regression only ever surfaced on main, after merge (found
# directly: a real hydration bug shipped to main and only failed here,
# with no earlier signal on Dev2 to catch it first). Vercel creates a
# real Deployments-API object with a real status for every push to any
# branch (Preview for Dev2, Production for main), unlike Netlify, which
# only posted an older commit-status mechanism deployment_status doesn't
# fire on -- that's what forced the old fixed `sleep 180` + hardcoded
# production-URL fallback this replaces. The resolve-url job below polls
# that real status instead: precise on both branches, and it audits
# Dev2's actual preview deployment rather than guessing at readiness or
# silently falling back to auditing production for a Dev2 push.
#
# workflow_dispatch remains for an exact on-demand run against any URL,
# deployed or not -- resolve-url is skipped entirely for that trigger.

on:
  push:
    branches: [main, Dev2]
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to audit (defaults to production)"
        required: false
        type: string

jobs:
  resolve-url:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      url: ${{ steps.resolve.outputs.url }}
    steps:
      - name: Wait for the Vercel deployment for this commit, resolve its URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          for i in $(seq 1 40); do
            deployment=$(gh api "repos/${{ github.repository }}/deployments?sha=$sha" --jq 'sort_by(.created_at) | reverse | .[0]')
            if [ -n "$deployment" ] && [ "$deployment" != "null" ]; then
              id=$(echo "$deployment" | jq -r .id)
              status_json=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0] // {}')
              state=$(echo "$status_json" | jq -r '.state // empty')
              url=$(echo "$status_json" | jq -r '.environment_url // empty')
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "Resolved deployment for $sha: $url"
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::Vercel deployment for $sha ended in state '$state' -- not auditing a broken deployment."
                exit 1
              fi
            fi
            echo "Deployment for $sha not ready yet (attempt $i/40), waiting 15s..."
            sleep 15
          done
          echo "::error::Timed out waiting for a Vercel deployment for $sha."
          exit 1

  lighthouse-public:
    needs: resolve-url
    if: always() && (github.event_name != 'push' || needs.resolve-url.result == 'success')
    runs-on: ubuntu-latest
    # This repo's default GITHUB_TOKEN permissions are read-only (confirmed
    # via the repo's Actions settings) -- without this explicit grant,
    # LHCI_GITHUB_TOKEN below would silently fail to post its per-URL
    # commit statuses (403, not a job failure) instead of actually working.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lighthouse (public pages)
        env:
          LHCI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || needs.resolve-url.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx lhci autorun --config=./lighthouserc.js

  # Logs into the admin dashboard as a dedicated CI-only staff account
  # (ci-lighthouse@teyezillaexpeditions.com, role: manager) and audits it
  # authenticated. Fetches a real session cookie first (see
  # scripts/fetch-admin-auth-cookie.mjs for why -- @lhci/cli's own
  # puppeteerScript auth mechanism proved unreliable) and passes it to
  # Lighthouse via extraHeaders. Needs LHCI_ADMIN_EMAIL /
  # LHCI_ADMIN_PASSWORD as repo secrets; fails fast with a clear error if
  # they're missing or login doesn't succeed.
  lighthouse-admin:
    needs: resolve-url
    if: always() && (github.event_name != 'push' || needs.resolve-url.result == 'success')
    runs-on: ubuntu-latest
    # This repo's default GITHUB_TOKEN permissions are read-only (confirmed
    # via the repo's Actions settings) -- without this explicit grant,
    # LHCI_GITHUB_TOKEN below would silently fail to post its per-URL
    # commit statuses (403, not a job failure) instead of actually working.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch admin session cookie
        id: cookie
        env:
          LHCI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || needs.resolve-url.outputs.url }}
          LHCI_ADMIN_EMAIL: ${{ secrets.LHCI_ADMIN_EMAIL }}
          LHCI_ADMIN_PASSWORD: ${{ secrets.LHCI_ADMIN_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          COOKIE=$(node scripts/fetch-admin-auth-cookie.mjs)
          echo "::add-mask::$COOKIE"
          echo "cookie=$COOKIE" >> "$GITHUB_OUTPUT"

      - name: Lighthouse (admin dashboard, authenticated)
        env:
          LHCI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || needs.resolve-url.outputs.url }}
          LHCI_ADMIN_COOKIE: ${{ steps.cookie.outputs.cookie }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx lhci autorun --config=./lighthouserc.admin.js

name: Lighthouse

# Performance/accessibility/SEO audits against a real deployment. Not run
# on every push in the sense of gating it -- Lighthouse audits are slow
# and this is meant to track trends and catch regressions after a deploy,
# not block a commit. Assertions in lighthouserc*.js are deliberately
# loose "warn" thresholds for now (no real baseline has been benchmarked
# yet); reports upload to temporary-public-storage and the shareable link
# is printed in the job log either way.
#
# Previously triggered on `deployment_status`, restricted to Vercel's
# Production environment -- that only ever worked because Vercel's GitHub
# App creates a formal Deployments-API object or every push, which is
# what deployment_status actually fires on. Netlify's default GitHub
# integration doesn't do that (it posts a commit status, a different and
# older mechanism) -- confirmed directly: after the Vercel->Netlify
# hosting migration, this workflow only kept running at all because
# Vercel's GitHub App was still connected and still deploying in
# parallel, auditing an increasingly stale target that no longer
# reflects the real site. Disconnect Vercel's GitHub App from this repo
# (Vercel dashboard -> Project -> Settings -> Git) once this is merged --
# nothing here depends on it anymore, and leaving it connected means
# every push keeps showing a misleading "Vercel - Deployment" check.
#
# Now runs on push to main -- i.e. right after a merge, which is what
# triggers Netlify's production build -- with a fixed wait for that build
# to finish before auditing. There's no signal available to know exactly
# when Netlify's deploy actually completes without wiring up an outgoing
# deploy-notification webhook (Site settings -> Build & deploy -> Deploy
# notifications -> add one for "Deploy succeeded", pointed at
# https://api.github.com/repos/OWNER/REPO/dispatches with a GitHub PAT --
# would let this trigger on `repository_dispatch` precisely instead of a
# guess); the wait below is a "good enough" heuristic given this
# workflow's own stated non-blocking, trend-tracking purpose -- a run
# that starts slightly early just audits the previous still-live
# deployment instead of the new one, not a broken run. workflow_dispatch
# remains for an exact on-demand run against any URL, deployed or not.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to audit (defaults to production)"
        required: false
        type: string

jobs:
  lighthouse-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Netlify's own build + CDN propagation for this site typically
      # finishes well under this -- see the comment above for why this is
      # a heuristic rather than a precise "deploy finished" signal.
      - name: Wait for Netlify production deploy
        if: github.event_name == 'push'
        run: sleep 180

      - name: Lighthouse (public pages)
        env:
          LHCI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || '' }}
        run: npx lhci autorun --config=./lighthouserc.js

  # Logs into the admin dashboard as a dedicated CI-only staff account
  # (ci-lighthouse@teyezillaexpeditions.com, role: manager) and audits it
  # authenticated. Fetches a real session cookie first (see
  # scripts/fetch-admin-auth-cookie.mjs for why -- @lhci/cli's own
  # puppeteerScript auth mechanism proved unreliable) and passes it to
  # Lighthouse via extraHeaders. Needs LHCI_ADMIN_EMAIL /
  # LHCI_ADMIN_PASSWORD as repo secrets; fails fast with a clear error if
  # they're missing or login doesn't succeed.
  lighthouse-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Wait for Netlify production deploy
        if: github.event_name == 'push'
        run: sleep 180

      - name: Fetch admin session cookie
        id: cookie
        env:
          LHCI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || '' }}
          LHCI_ADMIN_EMAIL: ${{ secrets.LHCI_ADMIN_EMAIL }}
          LHCI_ADMIN_PASSWORD: ${{ secrets.LHCI_ADMIN_PASSWORD }}
        run: |
          COOKIE=$(node scripts/fetch-admin-auth-cookie.mjs)
          echo "::add-mask::$COOKIE"
          echo "cookie=$COOKIE" >> "$GITHUB_OUTPUT"

      - name: Lighthouse (admin dashboard, authenticated)
        env:
          LHCI_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || '' }}
          LHCI_ADMIN_COOKIE: ${{ steps.cookie.outputs.cookie }}
        run: npx lhci autorun --config=./lighthouserc.admin.js

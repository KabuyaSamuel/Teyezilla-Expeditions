name: Smoke Test

# Hits real, deployed pages and checks they render without error --
# catches runtime-only issues (like a missing env var, or a schema/code
# mismatch after a migration) that build/typecheck/RLS tests can't, since
# those all run without ever making an HTTP request against the actual
# deployed environment.
#
# Runs on push to both main and Dev2 -- Dev2 was deliberately left out
# before, so a regression only ever surfaced on main, after merge. Vercel
# creates a real Deployments-API object with a real status for every push
# to any branch (Preview for Dev2, Production for main), unlike Netlify,
# which only posted an older commit-status mechanism deployment_status
# doesn't fire on -- that's what forced the old fixed `sleep 180` +
# hardcoded production-URL fallback this replaces. The resolve-url job
# below polls that real status instead: precise on both branches, and it
# tests Dev2's actual preview deployment rather than guessing at
# readiness or silently falling back to testing production for a Dev2
# push.
#
# Dev2's preview deployments sit behind Vercel's Deployment Protection SSO
# wall -- confirmed directly, this is what caused an earlier false-positive
# "pass" against a preview's /admin/login (the SSO login page returns 200
# with none of the error markers this script checks for). Fixed via
# Vercel's documented "Protection Bypass for Automation" header
# (VERCEL_AUTOMATION_BYPASS_SECRET, generated in the project's Deployment
# Protection settings), plus an explicit off-domain-redirect check in
# smoke-test.mjs itself as defense in depth if that secret is ever
# missing or stale.
#
# Other triggers:
#  - workflow_dispatch: run on demand against production or a given URL.
#  - schedule: a periodic production health check independent of deploys,
#    since this exact bug class (an env var or schema mismatch) isn't
#    always tied to a code push -- e.g. a migration applied directly to
#    the database without a matching code deploy.

on:
  push:
    branches: [main, Dev2]
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to test (defaults to production)"
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

jobs:
  resolve-url:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      url: ${{ steps.resolve.outputs.url }}
    steps:
      - name: Wait for the Vercel deployment for this commit, resolve its URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="${{ github.sha }}"
          for i in $(seq 1 40); do
            deployment=$(gh api "repos/${{ github.repository }}/deployments?sha=$sha" --jq 'sort_by(.created_at) | reverse | .[0]')
            if [ -n "$deployment" ] && [ "$deployment" != "null" ]; then
              id=$(echo "$deployment" | jq -r .id)
              status_json=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0] // {}')
              state=$(echo "$status_json" | jq -r '.state // empty')
              url=$(echo "$status_json" | jq -r '.environment_url // empty')
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "Resolved deployment for $sha: $url"
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::Vercel deployment for $sha ended in state '$state' -- not smoke-testing a broken deployment."
                exit 1
              fi
            fi
            echo "Deployment for $sha not ready yet (attempt $i/40), waiting 15s..."
            sleep 15
          done
          echo "::error::Timed out waiting for a Vercel deployment for $sha."
          exit 1

  smoke-test:
    needs: resolve-url
    if: always() && (github.event_name != 'push' || needs.resolve-url.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run smoke test
        env:
          TARGET_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || needs.resolve-url.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/smoke-test.mjs "$TARGET_URL"

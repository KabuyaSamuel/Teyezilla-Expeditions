name: Smoke Test

# Hits real, deployed pages and checks they render without error --
# catches runtime-only issues (like a missing Vercel env var) that build/
# typecheck/RLS tests can't, since those all run without ever making an
# HTTP request against the actual deployed environment.
#
# Three triggers:
#  - deployment_status: runs automatically right after Vercel's GitHub
#    integration reports a deployment finished, against that exact
#    deployment's URL (so a broken preview is caught on the PR that
#    caused it, not just in production).
#  - workflow_dispatch: run on demand against production or a given URL.
#  - schedule: a periodic production health check independent of deploys,
#    since this exact bug class (an env var that's missing or expires)
#    isn't tied to a code push.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to test (defaults to production)"
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run smoke test
        env:
          # environment_url is GitHub's current field; target_url is the
          # older one some integrations (including Vercel's) still send.
          TARGET_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url || inputs.url }}
        run: node scripts/smoke-test.mjs "$TARGET_URL"

name: Smoke Test

# Hits real, deployed pages and checks they render without error --
# catches runtime-only issues (like a missing env var, or a schema/code
# mismatch after a migration) that build/typecheck/RLS tests can't, since
# those all run without ever making an HTTP request against the actual
# deployed environment.
#
# Previously triggered on `deployment_status`, restricted to Vercel's
# Production environment (Preview sits behind Vercel's Deployment
# Protection SSO wall, so a script hitting a preview URL landed on
# vercel.com/login instead of the real app -- confirmed directly: this is
# what caused an earlier false-positive "pass" on a preview's
# /admin/login, since the SSO page returns 200 with no matching error
# markers). That trigger only ever worked because Vercel's GitHub App
# creates a formal Deployments-API object on every push, which is what
# deployment_status actually fires on -- Netlify's default GitHub
# integration doesn't do that (it posts a commit status instead, a
# different and older mechanism). After the Vercel->Netlify hosting
# migration this workflow only kept running at all because Vercel's
# GitHub App was still connected in parallel, testing an increasingly
# stale target. Disconnect Vercel's GitHub App from this repo (Vercel
# dashboard -> Project -> Settings -> Git) once this is merged -- nothing
# here depends on it anymore.
#
# Three triggers now:
#  - push to main: runs right after a merge, which is what triggers
#    Netlify's production build. Waits a fixed amount first since there's
#    no precise "Netlify deploy finished" signal wired up here (would
#    need an outgoing deploy-notification webhook -- Site settings ->
#    Build & deploy -> Deploy notifications -> "Deploy succeeded" ->
#    pointed at https://api.github.com/repos/OWNER/REPO/dispatches with a
#    GitHub PAT -- to trigger on `repository_dispatch` precisely instead).
#    A run that starts slightly early just tests the previous still-live
#    deployment instead of the new one, not a broken run.
#  - workflow_dispatch: run on demand against production or a given URL.
#  - schedule: a periodic production health check independent of deploys,
#    since this exact bug class (an env var or schema mismatch) isn't
#    always tied to a code push -- e.g. a migration applied directly to
#    the database without a matching code deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to test (defaults to production)"
        required: false
        type: string
  schedule:
    - cron: "0 */6 * * *"

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Wait for Netlify production deploy
        if: github.event_name == 'push'
        run: sleep 180

      - name: Run smoke test
        env:
          TARGET_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || '' }}
        run: node scripts/smoke-test.mjs "$TARGET_URL"

[build.environment]
  # Netlify's secrets scanner flags any env var value it finds baked into
  # the build output. These three are confirmed non-sensitive (two plain
  # email addresses, one intentionally-public GA tracking ID) and are
  # meant to be public, so they're excluded by name rather than disabling
  # the scan entirely -- which would also stop protecting the real
  # secrets (Supabase service role key, Resend API key, Sentry auth
  # token, Upstash Redis token).
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_NOTIFICATION_EMAIL,EMAIL_FROM,NEXT_PUBLIC_GA_MEASUREMENT_ID"

# NOT ACTIVE IN PRODUCTION. Production hosting moved back to Vercel
# (2026-08-16); the Netlify project is disabled and this file governs
# nothing live right now. Kept, not deleted, as a backup: switching back to
# Netlify again would only take re-enabling the project and connecting the
# domain -- this config would already be correct and ready, nothing to
# rebuild. See README.md for the current (Vercel) hosting setup.

# Canonicalizes the Netlify subdomain to the real domain -- e.g. a link
# shared before DNS cutover, a stray bookmark, or a bot that resolved the
# *.netlify.app URL. Must come before any catch-all/SPA fallback redirect
# in this file (Netlify evaluates [[redirects]] in order, first match
# wins) since this needs to intercept every path first. force = true is
# required because otherwise Netlify only falls back to a redirect when no
# static file/Next.js route matches the request first -- without it, this
# rule would never fire for any real page.
[[redirects]]
  from = "https://teyezillaexpeditions.netlify.app/*"
  to = "https://www.teyezillaexpeditions.com/:splat"
  status = 301
  force = true

# lib/site.ts's SITE_URL (used for every canonical tag, the sitemap, and
# JSON-LD) is the www subdomain -- without this, the apex domain staying
# independently crawlable/indexable splits ranking signals across two
# domain variants for the same content.
[[redirects]]
  from = "https://teyezillaexpeditions.com/*"
  to = "https://www.teyezillaexpeditions.com/:splat"
  status = 301
  force = true

# public/*.png (logo, og-image) otherwise serve with max-age=0,must-revalidate,
# one of the Lighthouse "efficient cache lifetimes" findings. A day, not a
# year/immutable -- these are plain filenames, not content-hashed like
# _next/static, so a long cache risks repeating the stale-logo confusion
# this project already ran into once. llms.txt is deliberately left
# uncached so crawlers always see the current version.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[build.environment]
  # Netlify's secrets scanner flags any env var value it finds baked into
  # the build output. Everything listed here is confirmed non-sensitive
  # and meant to be public: every NEXT_PUBLIC_* var is inlined into the
  # client bundle by Next.js's own design (that's what the prefix means),
  # SENTRY_PROJECT is just a project slug used by the Sentry build plugin,
  # and ADMIN_NOTIFICATION_EMAIL/EMAIL_FROM are plain email addresses.
  # Excluded by name rather than disabling the scan entirely, which would
  # also stop protecting the real secrets (Supabase service role key,
  # Resend API key, Sentry auth token, Upstash Redis token). SENTRY_DSN
  # is server/edge-only (sentry.server.config.ts, sentry.edge.config.ts)
  # and every flagged match was in a server or edge chunk, never a
  # client-shipped file -- and DSNs aren't secret credentials by design,
  # just a write-only ingest endpoint.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_NOTIFICATION_EMAIL,EMAIL_FROM,NEXT_PUBLIC_GA_MEASUREMENT_ID,SENTRY_PROJECT,NEXT_PUBLIC_WHATSAPP_NUMBER,NEXT_PUBLIC_GTM_ID,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SENTRY_DSN,SENTRY_DSN,NEXT_PUBLIC_CLARITY_PROJECT_ID"

  # Different problem from the omit-by-key list above: Turbopack's build
  # cache (.netlify/.next/cache/turbopack/*.sst) legitimately embeds
  # resolved env var values -- including real secrets like
  # RESEND_API_KEY -- so a subsequent build can skip re-resolving them.
  # That's normal Next.js/Turbopack caching behavior, not a leak: this
  # path is a build-time-only artifact, never part of the deployed output
  # a visitor's browser can reach. Omit-by-key can't fix this (the value
  # itself is a real secret, correctly not on that list) -- omitting the
  # cache path entirely is Netlify's own documented fix for this exact
  # false positive.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache"
